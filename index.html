<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moral Case Relevance | Collaborator Working Brief</title>
  <meta name="description" content="Collaborator-facing working brief: one accountability target, eight dataset-derived dilemmas, and exploratory 1–7 relevance ratings.">
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    :root { --paper:#f7f6f2; --card:#fffefa; --ink:#173139; --muted:#617078; --line:#dce3e0; --green:#146458; --mint:#e6f2ed; --blue:#365f91; --bluebg:#e9f0fb; --gold:#b57833; }
    * { box-sizing:border-box; }

    body { background:var(--paper);color:var(--ink); margin:0; }
    .jspsych-display-element { background:var(--paper); min-height:100vh; }
    .jspsych-content-wrapper { display:block; }

    h1,h2,h3,p { margin-top:0; }
    p { line-height:1.65; }
    a { color:var(--green); }
    .page { max-width:1180px; margin:auto; }
    .eyebrow { letter-spacing:.12em;text-transform:uppercase;font-size:.73rem;font-weight:800;color:var(--green); }
    .masthead { padding:58px 0 24px; border-bottom:1px solid var(--line); }
    .masthead h1 { max-width:850px; margin:13px 0 12px; font-size:clamp(2.2rem,5vw,4.2rem);letter-spacing:-.055em;line-height:1.07;font-weight:780; }
    .lede { max-width:790px;font-size:1.1rem;color:var(--muted);margin-bottom:22px; }
    .facts { display:flex;flex-wrap:wrap; gap:8px; }
    .fact { border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.82rem;font-weight:650;background:#fff; }
    .nav { display:flex;flex-wrap:wrap;gap:21px;padding:19px 0 7px;font-size:.86rem;font-weight:700; }
    .nav a { text-decoration:none;color:var(--muted); }
    .nav a:hover { color:var(--green); }
    section { margin-top:47px; scroll-margin-top:20px; }
    .section-eyebrow { font-size:.77rem;letter-spacing:.1em;font-weight:800;color:var(--green);text-transform:uppercase; }
    h2 { font-size:clamp(1.45rem,2.6vw,2rem); letter-spacing:-.03em;margin:7px 0 11px; }
    .section-intro { max-width:850px;color:var(--muted);font-size:.96rem; }
    .framework { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px; }
    .framework-item,.target-card,.panel,.case-card { background:var(--card);border:1px solid var(--line);border-radius:15px; }
    .framework-item { padding:22px 20px; }
    .framework-item .number { font-size:.8rem;color:var(--gold);font-weight:850; }
    .framework-item h3 { font-size:1.07rem;margin:8px 0;letter-spacing:-.02em; }
    .framework-item p { font-size:.9rem;color:var(--muted);margin-bottom:0; }
    .target-card { padding:clamp(22px,4vw,37px);border-left:5px solid var(--green); }
    .target-prompt { font-size:clamp(1.12rem,2vw,1.4rem);line-height:1.6;max-width:960px;font-weight:570; }
    .tag-row { display:flex; flex-wrap:wrap;gap:7px;margin:13px 0 18px; }
    .tag { display:inline-block; padding:5px 10px;background:var(--mint);color:var(--green);font-size:.74rem;font-weight:800;border-radius:999px; }
    .tag.blue { color:var(--blue);background:var(--bluebg); }
    .target-notes { display:grid;grid-template-columns:1fr 1.5fr;gap:14px; }
    .note { padding:14px 16px;background:#f3f6f3;border-radius:9px;font-size:.89rem;line-height:1.6; }
    .note strong { display:block;margin-bottom:4px; }
    .matrix-wrap { overflow:auto; background:#fff;border:1px solid var(--line);border-radius:13px;margin-top:18px; }
    table { width:100%;border-collapse:collapse;font-size:.91rem; }
    th,td { padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top; }
    thead th { color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;background:#f4f7f5; }
    tbody tr:last-child td { border-bottom:none; }
    .muted { color:var(--muted); }
    .group-head { margin:32px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap; }
    .group-head h3 { font-size:1.3rem;margin:0; }
    .group-head span { color:var(--muted);font-size:.87rem; }
    .case-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch; }
    .case-card { display:flex;flex-direction:column;padding:23px;position:relative; }
    .case-card.rated { border-color:#7fb4a7;box-shadow:0 0 0 1px #7fb4a7; }
    .case-top { display:flex;justify-content:space-between;gap:8px;align-items:flex-start; }
    .case-key { font-size:.72rem;font-weight:820;color:var(--green);letter-spacing:.075em;text-transform:uppercase; }
    .case-id { font-size:.75rem;color:var(--muted);font-weight:720;white-space:nowrap; }
    .case-card h4 { margin:12px 0 12px;font-size:1.18rem;letter-spacing:-.025em;line-height:1.3; }
    .case-text { font-size:.93rem;line-height:1.65;margin-bottom:18px; }
    .reason { margin-top:auto;padding:13px 15px;border-radius:10px;background:#f3f6f3;color:#3c5557;font-size:.85rem;line-height:1.5; }
    .reason b { color:var(--ink);display:block;margin-bottom:4px; }
    .rating-area { padding-top:16px; margin-top:15px; border-top:1px solid var(--line); }
    .rating-question { display:block;font-size:.88rem;font-weight:750;line-height:1.5;margin-bottom:12px; }
    .rating-row { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px; }
    .rating-option { cursor:pointer;position:relative; }
    .rating-option input { position:absolute;opacity:0;width:1px;height:1px; }
    .rating-option span { display:block;text-align:center;padding:10px 0;border:1px solid #ced9d5;border-radius:8px;background:#fff;font-weight:750;font-size:.9rem; }
    .rating-option:hover span { border-color:var(--green);background:var(--mint); }
    .rating-option input:checked+span { background:var(--green);color:#fff;border-color:var(--green); }
    .rating-option input:focus-visible+span { outline:3px solid #94b8e3;outline-offset:2px; }
    .scale-ends { display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;gap:12px;margin-top:9px; }
    .toolbar { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:20px 23px;margin-top:27px;background:#e8f1ed;border:1px solid #cbded5;border-radius:13px; }
    .status { font-size:.87rem;font-weight:750; }
    .actions { display:flex;flex-wrap:wrap;gap:8px; }
    button { cursor:pointer;font:inherit; }
    .action-btn { background:var(--green);border:1px solid var(--green);color:white;padding:10px 15px;border-radius:9px;font-size:.84rem;font-weight:760; }
    .action-btn.secondary { background:white;color:var(--green); }
    .action-btn:hover { filter:brightness(.94); }
    .action-btn:focus-visible { outline:3px solid #94b8e3;outline-offset:2px; }
    .caution { background:#fff9f0;border:1px solid #ecd8b8;border-radius:13px;padding:20px 24px; }
    .caution h3 { margin-bottom:8px;font-size:1.06rem; }
    .caution p { font-size:.92rem;color:#68533d; margin-bottom:0; }
    .foot { padding-top:25px;border-top:1px solid var(--line);color:var(--muted);font-size:.79rem;line-height:1.6; }
    #feedback { font-size:.8rem;color:var(--green);min-height:1.2em;font-weight:700; }
    @media(max-width:800px) { .framework,.case-grid,.target-notes { grid-template-columns:1fr; } .masthead { padding-top:37px; } .case-card { padding:19px; } .jspsych-content { padding:0 15px 45px; } }
    @media(prefers-reduced-motion:reduce) { html {scroll-behavior:auto;} }
  </style>
</head>
<body>
  <template id="brief-template">
    <main class="page">
      <header class="masthead">
        <div class="eyebrow">Collaborator working brief · Stimulus design v1</div>
        <h1>What makes a prior moral case relevant?</h1>
        <p class="lede">An exploratory case-relevance exercise built around one workplace accountability dilemma and eight candidate prior cases from DailyDilemmas. This is a research walkthrough, not a formal participant study.</p>
        <div class="facts"><span class="fact">1 fixed target</span><span class="fact">8 candidate cases</span><span class="fact">2 values × 2 depths × 2 distances</span><span class="fact">1–7 relevance judgments</span></div>
      </header>
      <nav class="nav" aria-label="Document sections"><a href="#framework">Logic of the design</a><a href="#target">Target case</a><a href="#matrix">Condition matrix</a><a href="#cases">Review the cases</a><a href="#limits">What remains uncertain</a></nav>

      <section id="framework">
        <div class="section-eyebrow">01 / Research question</div>
        <h2>Why might one case help us reason about another?</h2>
        <p class="section-intro">We are exploring whether perceived relevance depends on shared moral values, correspondence in the underlying relations between actors, or similarity in institutional setting. These are <strong>proposed distinctions to validate</strong>, not already-proven independent factors.</p>
        <div class="framework">
          <div class="framework-item"><div class="number">A / VALUE</div><h3>Which moral concern?</h3><p><strong>Accountability</strong> is present in the target; <strong>safety</strong> is our contrasting value. A label match alone does not guarantee that cases share a precise normative principle.</p></div>
          <div class="framework-item"><div class="number">B / DEPTH</div><h3>How are the roles and relations aligned?</h3><p><strong>Deep:</strong> an observer encounters another person's concerning conduct and considers escalating it to an authority. <strong>Shallow:</strong> the decision follows a different relational pattern.</p></div>
          <div class="framework-item"><div class="number">C / DISTANCE</div><h3>How similar is the setting?</h3><p><strong>Near:</strong> a workplace or professional organizational setting. <strong>Far:</strong> an educational, friendship, family, or social context outside ordinary workplace roles.</p></div>
        </div>
      </section>

      <section id="target">
        <div class="section-eyebrow">02 / Fixed reference point</div>
        <h2>Target: workplace accountability</h2>
        <div class="target-card">
          <div class="tag-row"><span class="tag">Accountability</span><span class="tag blue">Workplace</span><span class="tag blue">DailyDilemmas · #55</span></div>
          <p class="target-prompt">You're a project manager in a marketing firm. You notice a colleague using company resources for a personal project during office hours, undermining the company's policy. Should you take initiative and report this to your superior?</p>
          <div class="target-notes">
            <div class="note"><strong>Why accountability?</strong> It operates at two levels: the colleague's answerability for their use of shared resources, and the project manager's potential responsibility to address or report the conduct.</div>
            <div class="note"><strong>Proposed relational structure</strong>An observer becomes aware of another person's concerning conduct and must decide whether to escalate it to an authority, potentially imposing consequences on that person.</div>
          </div>
        </div>
      </section>

      <section id="matrix">
        <div class="section-eyebrow">03 / Stimulus construction</div>
        <h2>Eight cells, one candidate in each</h2>
        <p class="section-intro">We hold the target constant and vary value, proposed structural depth, and contextual distance across the candidate cases. Every case is a dilemma without an observed resolution.</p>
        <div class="matrix-wrap"><table>
          <thead><tr><th>Value relative to target</th><th>Deep · Near</th><th>Deep · Far</th><th>Shallow · Near</th><th>Shallow · Far</th></tr></thead>
          <tbody>
            <tr><th>Accountability (same)</th><td>#4663<br><span class="muted">Colleague bullying</span></td><td>#3056<br><span class="muted">Teacher bullying</span></td><td>#16230<br><span class="muted">Manager's mistake</span></td><td>#7407<br><span class="muted">Borrowed book</span></td></tr>
            <tr><th>Safety (different)</th><td>#13115<br><span class="muted">Restaurant hygiene</span></td><td>#7723<br><span class="muted">School-bus driver</span></td><td>#17048<br><span class="muted">Security flaw</span></td><td>#43621<br><span class="muted">Party while ill</span></td></tr>
          </tbody>
        </table></div>
      </section>

      <section id="cases">
        <div class="section-eyebrow">04 / Interactive case review</div>
        <h2>How relevant is each case to the target?</h2>
        <p class="section-intro">Rate <strong>each case independently</strong> on a 1–7 scale rather than selecting only the single most relevant case. Think about how useful the prior situation is for reasoning about the target dilemma, not whether you would make the same decision. Dataset wording is preserved below; the mapping explanations are our provisional interpretations.</p>
        <div id="case-list"></div>
        <div class="toolbar">
          <div><div class="status" id="rating-progress" aria-live="polite">0 of 8 cases rated</div><div id="feedback" aria-live="polite"></div></div>
          <div class="actions">
            <button type="button" class="action-btn" id="download-btn">Download ratings CSV</button>
            <button type="button" class="action-btn secondary" id="copy-btn">Copy review summary</button>
            <button type="button" class="action-btn secondary" id="reset-btn">Clear ratings</button>
          </div>
        </div>
      </section>

      <section id="limits">
        <div class="section-eyebrow">05 / Interpretation</div>
        <h2>What this prototype can, and cannot, establish</h2>
        <div class="caution">
          <h3>Working hypotheses, not validated manipulations</h3>
          <p>Safety and accountability can co-occur; the contrast is not necessarily exclusive. “Deep” cases differ in how the observer learns about the conduct, and “near” professional contexts (such as restaurants and software teams) are not identical to marketing firms. Severity, uncertainty, and personal relationships also vary. A separate pilot should test perceived value similarity, relational alignment, contextual distance, and severity before treating these as orthogonal factors. A relevance rating alone cannot identify which feature caused the rating.</p>
        </div>
      </section>

      <footer class="foot">Source: <a href="https://huggingface.co/datasets/kellycyy/daily_dilemmas" target="_blank" rel="noopener noreferrer">DailyDilemmas</a>. Dataset IDs and case texts are included for traceability. No case outcomes are shown. These are candidate prior dilemmas, not authoritative precedents with established decisions. Ratings remain in this browser session and are never transmitted; exporting or copying is optional.</footer>
    </main>
  </template>
  <script>
    "use strict";
    const CASES = [{"id":4663,"value":"Accountability","depth":"Deep","distance":"Near","title":"Harassment policy and a close colleague","text":"You work in a company where there's a zero-tolerance policy for any kind of harassment. Your closest colleague, who is also a single parent struggling with finances, is involved in bullying a new employee. Do you report your colleague's behavior and potentially jeopardize their financial situation?","rationale":"Witnessing another employee's misconduct and deciding whether to escalate it."},{"id":3056,"value":"Accountability","depth":"Deep","distance":"Far","title":"Bullying by a fellow teacher","text":"You are a teacher who has observed a fellow teacher bullying students in class. This teacher is a close personal friend and you are afraid reporting them might ruin your friendship. Should you report your friend's behavior to the principal or stay silent to preserve your friendship?","rationale":"Similar observer–misconduct–authority structure, but in a school rather than a marketing firm."},{"id":16230,"value":"Accountability","depth":"Shallow","distance":"Near","title":"A manager's own reporting mistake","text":"You are a manager at a large corporation. You realize a mistake you made in a report could potentially cost the company millions. Do you accept responsibility and possibly lose your job, or stay quiet hoping no one will notice?","rationale":"Workplace accountability, but acknowledging one's own mistake rather than reporting another person's misconduct."},{"id":7407,"value":"Accountability","depth":"Shallow","distance":"Far","title":"A damaged borrowed book","text":"You've borrowed a rare book from a friend who's an avid collector. In the meantime, your sibling, unaware of the book's origin, accidentally damaged it severely. Should you return the book as it is and tell your friend the truth, or should you try to find a replacement without letting your friend know?","rationale":"Responsibility for entrusted property in a personal relationship, with different actors and decision structure."},{"id":13115,"value":"Safety","depth":"Deep","distance":"Near","title":"Food-safety practices in a restaurant","text":"You are a chef in a popular restaurant that emphasizes the importance of safe food preparation practices. One day, you notice your sous-chef is not washing their hands properly before preparing food, which could lead to foodborne illnesses among the customers. Do you report your colleague to your superiors, potentially jeopardizing their job, or do you confront them privately about their unsafe practices?","rationale":"Observing a colleague's concerning conduct and deciding whether to escalate it, with customer safety foregrounded."},{"id":7723,"value":"Safety","depth":"Deep","distance":"Far","title":"A friend's school-bus driving","text":"Your friend tells you about their struggle with substance abuse. They are a school bus driver, and you fear for the safety of the children. Should you report your friend to their employer?","rationale":"Learning concerning information about someone known to you and deciding whether to notify an authority despite relational costs."},{"id":17048,"value":"Safety","depth":"Shallow","distance":"Near","title":"A software security flaw","text":"John has always been insecure about his abilities despite his talent as a software engineer. He discovered a serious security flaw in the software he's working on, but fears he might be wrong and lose his job if he brings it up. Should he risk his job security by reporting the potential security flaw or remain silent and potentially compromise the safety of the software users?","rationale":"Raising a possible technical risk rather than holding a colleague responsible for misconduct."},{"id":43621,"value":"Safety","depth":"Shallow","distance":"Far","title":"Canceling a party while sick","text":"You've planned a party but fall ill the day before it is scheduled. You have friends traveling from out of town specifically for this event, but attending the party while sick could potentially spread illness to others. Should you cancel the party and disappoint your friends or risk potentially making others sick by going ahead with it?","rationale":"Changing one's own plans to avoid harm, rather than escalating another person's conduct to an authority."}];
    function escapeHTML(x) {
      return String(x).replace(/[&<>"']/g, function(ch) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
      });
    }
    function buildCard(c) {
      var inputs = "";
      for (var n=1;n<=7;n++) {
        inputs += '<label class="rating-option"><input type="radio" name="rating-' + c.id + '" value="' + n + '" aria-label="Case ' + c.id + ': relevance ' + n + ' out of 7"><span>' + n + '</span></label>';
      }
      return '<article class="case-card" data-case="' + c.id + '" aria-label="Candidate case ' + c.id + '">' +
        '<div class="case-top"><span class="case-key">' + escapeHTML(c.depth) + ' structure · ' + escapeHTML(c.distance) + ' context</span><span class="case-id">ID ' + c.id + '</span></div>' +
        '<h4>' + escapeHTML(c.title) + '</h4><p class="case-text">' + escapeHTML(c.text) + '</p>' +
        '<div class="reason"><b>Why this condition?</b>' + escapeHTML(c.rationale) + '</div>' +
        '<div class="rating-area"><span class="rating-question" id="question-' + c.id + '">How relevant is this prior case for reasoning about the target?</span>' +
        '<div class="rating-row" role="group" aria-labelledby="question-' + c.id + '">' + inputs + '</div><div class="scale-ends"><span>1 · Not relevant</span><span>7 · Extremely relevant</span></div></div></article>';
    }
    function buildGroups() {
      return ["Accountability","Safety"].map(function(value) {
        var label = value === "Accountability" ? "Same value as target" : "Contrasting value";
        return '<div class="group-head"><h3>' + value + '</h3><span>' + label + ' · Four case comparisons</span></div><div class="case-grid">' +
          CASES.filter(function(c) { return c.value===value; }).map(buildCard).join("") + '</div>';
      }).join("");
    }
    class CollaboratorBrief {
      constructor(jsPsych) { this.jsPsych=jsPsych; }
      trial(display_element) {
        display_element.innerHTML = document.getElementById("brief-template").innerHTML;
        display_element.querySelector("#case-list").innerHTML = buildGroups();
        var ratings = {};
        var progress = display_element.querySelector("#rating-progress");
        var feedback = display_element.querySelector("#feedback");
        function updateProgress() {
          progress.textContent = Object.keys(ratings).length + " of " + CASES.length + " cases rated";
        }
        function asCSV() {
          function quote(x) { return '"' + String(x == null ? "" : x).replace(/"/g,'""') + '"'; }
          var columns = ["dataset_id","value","depth","distance","title","relevance_1_to_7","rationale"];
          return [columns.join(",")].concat(CASES.map(function(c){
            return [c.id,c.value,c.depth,c.distance,c.title,ratings[c.id] || "",c.rationale].map(quote).join(",");
          })).join("\r\n");
        }
        function asText() {
          var text = "Moral Case Relevance · collaborator working brief\nTarget: Marketing firm · accountability · DailyDilemmas #55\nRelational structure: An observer becomes aware of another person's concerning conduct and must decide whether to escalate it to an authority, potentially imposing consequences on that person.\n\n";
          return text + CASES.map(function(c) {
            return "#" + c.id + " | " + c.value + " | " + c.depth + " | " + c.distance + " | Relevance: " + (ratings[c.id] || "not rated") + "/7\n" + c.title + "\n" + c.rationale;
          }).join("\n\n");
        }
        display_element.querySelectorAll('input[type="radio"]').forEach(function(input){
          input.addEventListener("change",function(){
            var id = Number(this.name.replace("rating-",""));
            ratings[id] = Number(this.value);
            var card = this.closest(".case-card");
            if(card) card.classList.add("rated");
            feedback.textContent="";
            updateProgress();
          });
        });
        display_element.querySelector("#download-btn").addEventListener("click",function(){
          var blob = new Blob([asCSV()],{type:"text/csv;charset=utf-8;"});
          var url = URL.createObjectURL(blob);
          var a=document.createElement("a");
          a.href=url;a.download="moral_case_relevance_review.csv";document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url);},1000);
          feedback.textContent="CSV prepared locally. Unrated cells are blank.";
        });
        display_element.querySelector("#copy-btn").addEventListener("click",function(){
          if(navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(asText()).then(function(){feedback.textContent="Review summary copied.";},function(){feedback.textContent="Copy unavailable in this browser. Use Download ratings CSV.";});
          } else {
            feedback.textContent="Clipboard unavailable in this browser. Use Download ratings CSV.";
          }
        });
        display_element.querySelector("#reset-btn").addEventListener("click",function(){
          ratings={};
          display_element.querySelectorAll('input[type="radio"]').forEach(function(input){input.checked=false;});
          display_element.querySelectorAll(".case-card.rated").forEach(function(card){card.classList.remove("rated");});
          updateProgress();feedback.textContent="Ratings cleared.";
        });
        updateProgress();
      }
    }
    CollaboratorBrief.info={name:"collaborator-brief",parameters:{}};
    const jsPsych=initJsPsych({show_progress_bar:false});
    jsPsych.run([{type:CollaboratorBrief}]);
  </script>
</body>
</html>
